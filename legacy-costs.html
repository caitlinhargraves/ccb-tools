<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCB Legacy Cost Review</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1B2A4A;--cyan:#00AEEF;--bg:#E8EBF4;--white:#FFFFFF;--muted:#6B7280;--subtle:#9CA3AF;--border2:#E5E7EB;--green:#00A86B;--red:#D14343;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--navy);font-family:'Inter',sans-serif;min-height:100vh;font-size:16px;line-height:1.6;}

  #loginGate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
  .login-card{background:var(--white);border-radius:18px;padding:32px 28px;width:100%;max-width:340px;box-shadow:0 12px 40px rgba(27,42,74,.14);}
  .login-title{font-size:22px;font-weight:800;margin-bottom:4px;}
  .login-sub{font-size:14px;color:var(--muted);margin-bottom:20px;}
  .login-field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .login-field input{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:10px;font-size:16px;font-family:'Inter',sans-serif;background:var(--bg);margin-bottom:14px;}
  .login-btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;cursor:pointer;}
  .login-error{font-size:13px;color:var(--red);margin-top:8px;min-height:16px;}

  #app{display:none;}
  .header{background:var(--white);border-bottom:1px solid #D1D5DB;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;}
  .back-btn{background:none;border:none;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;}

  .page-wrap{max-width:640px;margin:0 auto;padding:28px 18px 100px;}
  .page-title{font-size:26px;font-weight:800;margin-bottom:8px;}
  .page-sub{font-size:15px;color:var(--muted);margin-bottom:24px;}

  .progress-banner{background:var(--white);border:1px solid var(--border2);border-radius:16px;padding:18px 20px;margin-bottom:24px;text-align:center;}
  .progress-num{font-size:34px;font-weight:800;color:var(--navy);}
  .progress-lbl{font-size:14px;color:var(--muted);margin-top:2px;}

  .done-state{text-align:center;padding:60px 20px;}
  .done-emoji{font-size:48px;margin-bottom:10px;}
  .done-title{font-size:20px;font-weight:800;margin-bottom:6px;}
  .done-sub{font-size:14px;color:var(--muted);}

  .order-card{background:var(--white);border:1px solid var(--border2);border-radius:18px;padding:22px 22px 24px;margin-bottom:16px;}
  .order-name{font-size:19px;font-weight:800;margin-bottom:4px;}
  .order-line{font-size:14.5px;color:var(--muted);margin-bottom:18px;}
  .order-line b{color:var(--navy);}

  .big-label{font-size:15px;font-weight:700;margin-bottom:8px;display:block;}
  .cost-input-wrap{position:relative;margin-bottom:6px;}
  .dollar-sign{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:700;color:var(--subtle);}
  .cost-input{width:100%;padding:14px 14px 14px 32px;border:2px solid var(--border2);border-radius:12px;font-size:22px;font-weight:700;font-family:'Inter',sans-serif;}
  .cost-input:focus{outline:none;border-color:var(--cyan);}
  .cost-hint{font-size:13px;color:var(--subtle);margin-bottom:18px;}

  .result-box{background:var(--bg);border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:15px;display:none;}
  .result-box.show{display:block;}
  .result-box b{color:var(--navy);}

  .rep-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;font-size:14.5px;color:var(--muted);}
  .rep-row select{padding:8px 12px;border:1.5px solid var(--border2);border-radius:8px;font-size:14.5px;font-family:'Inter',sans-serif;background:var(--white);color:var(--navy);font-weight:600;}

  .save-btn{width:100%;padding:15px;border:none;border-radius:12px;background:var(--cyan);color:#fff;font-weight:700;font-size:16px;cursor:pointer;}
  .save-btn:disabled{background:var(--border2);color:var(--subtle);cursor:not-allowed;}
  .skip-btn{width:100%;padding:12px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}

  .saved-flash{text-align:center;padding:14px;background:#E6FBF3;border-radius:12px;color:var(--green);font-weight:700;font-size:15px;}
  .loading{text-align:center;color:var(--muted);padding:60px 0;font-size:15px;}
</style>
</head>
<body>

<div id="loginGate">
  <div class="login-card">
    <div class="login-title">Legacy Cost Review</div>
    <div class="login-sub">Admin access only.</div>
    <div class="login-field"><label>Password</label><input type="password" id="loginPassword" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" onclick="doLogin()">Log In</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="app">
  <div class="header">
    <button class="back-btn" onclick="location.href='index.html'">← Back Home</button>
    <button class="back-btn" onclick="location.reload()">Log out</button>
  </div>
  <div class="page-wrap">
    <div class="page-title">Fix an old order's numbers</div>
    <div class="page-sub">These are orders from before the Quotes tool. They never had a real cost on file, so we don't know their true profit yet. Just tell us what it actually cost, one at a time.</div>
    <div id="content"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
const ALL_REPS = ['Chaz Lucius','Bailey McGraw','Jess Miller','Nick Miller','George Miller','Caitlin Hargraves','Bryce','Tucker'];
let orders = [];
let currentIndex = 0;

async function doLogin(){
  const password = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  try{
    const r = await fetch('/api/rep/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password,selectedRep:'Admin'})});
    const d = await r.json();
    if(!d.ok || d.role!=='Admin'){ err.textContent = 'Admin password required.'; return; }
    document.getElementById('loginGate').style.display='none';
    document.getElementById('app').style.display='block';
    loadOrders();
  }catch(e){ err.textContent = 'Login failed.'; }
}

async function loadOrders(){
  try{
    const r = await fetch('/api/legacy-orders/needs-review');
    const d = await r.json();
    orders = d.orders || [];
    currentIndex = 0;
    render();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="loading">Could not load orders. Try refreshing the page.</div>';
  }
}

function render(){
  const total = orders.length;
  if(total === 0){
    document.getElementById('content').innerHTML =
      '<div class="done-state"><div class="done-emoji">🎉</div><div class="done-title">All caught up!</div><div class="done-sub">Every old order has a real cost on file now.</div></div>';
    return;
  }

  const o = orders[0]; // always work the top of the list; finished ones get removed
  const remaining = total;

  document.getElementById('content').innerHTML =
    '<div class="progress-banner"><div class="progress-num">'+remaining+'</div><div class="progress-lbl">order'+(remaining!==1?'s':'')+' still need a real cost</div></div>' +
    '<div class="order-card">' +
      '<div class="order-name">'+o.name+'</div>' +
      '<div class="order-line">Sold for <b>$'+o.revenue.toLocaleString()+'</b>'+(o.date?' on '+o.date:'')+'</div>' +

      '<label class="big-label">What did this order actually cost?</label>' +
      '<div class="cost-input-wrap"><span class="dollar-sign">$</span><input type="number" step="0.01" class="cost-input" id="costInput" placeholder="0.00" oninput="updatePreview()"></div>' +
      '<div class="cost-hint">Total cost of goods for this whole order (garments, decoration, everything).</div>' +

      '<div class="result-box" id="resultBox"></div>' +

      '<div class="rep-row">Sales rep on this order: <select id="repSelect">'+ALL_REPS.map(function(r){return '<option'+(r===o.salesPerson?' selected':'')+'>'+r+'</option>';}).join('')+'</select></div>' +

      '<button class="save-btn" id="saveBtn" disabled onclick="saveCost(\''+o.id+'\')">Save This Cost</button>' +
      '<button class="skip-btn" onclick="skipOrder()">Skip for now, come back later →</button>' +
    '</div>';
}

function updatePreview(){
  const cost = parseFloat(document.getElementById('costInput').value);
  const box = document.getElementById('resultBox');
  const btn = document.getElementById('saveBtn');
  if(isNaN(cost) || cost < 0){
    box.classList.remove('show');
    btn.disabled = true;
    return;
  }
  const o = orders[0];
  const profit = o.revenue - cost;
  const commission = profit * o.commissionRate;
  box.classList.add('show');
  box.innerHTML = 'That leaves <b>$'+profit.toFixed(2)+'</b> in profit, so the commission on this order will be <b>$'+commission.toFixed(2)+'</b>.';
  btn.disabled = false;
}

function skipOrder(){
  const skipped = orders.shift();
  orders.push(skipped);
  render();
}

async function saveCost(orderId){
  const cost = parseFloat(document.getElementById('costInput').value);
  const repSelect = document.getElementById('repSelect');
  const o = orders[0];
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try{
    if(repSelect.value !== o.salesPerson){
      await fetch('/api/legacy-orders/reassign-rep',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:orderId,salesPerson:repSelect.value})});
    }
    const r = await fetch('/api/legacy-orders/edit-cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:orderId,cost:cost})});
    const d = await r.json();
    if(!d.ok){ alert(d.error||'Save failed'); btn.disabled=false; btn.textContent='Save This Cost'; return; }

    document.getElementById('content').insertAdjacentHTML('afterbegin', '<div class="saved-flash">Saved and locked in ✓</div>');
    orders.shift();
    setTimeout(render, 900);
  }catch(e){
    alert('Save failed. Try again.');
    btn.disabled=false; btn.textContent='Save This Cost';
  }
}
</script>
</body>
</html>
